name: CI

on:
  push:
    branches:
      - main
      - sprint-1
      - sprint-2
      - sprint-3
      - final-sprint

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m compileall -q src tests

      - name: Run tests
        run: |
          python -m pytest -q
